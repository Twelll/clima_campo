name: estacao-meteorologica

services:
  receptor:
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      # Porta do notebook/Ubuntu -> porta interna do container.
      - "${PORTA_HTTP:-49173}:8080"
    environment:
      ESTACAO_API_TOKEN: "${ESTACAO_API_TOKEN:-}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - medicoes:/dados
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  medicoes:
